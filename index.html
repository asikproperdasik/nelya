<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1a0b36">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Открой открытку</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Forum&family=Raleway:wght@300;400;500&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#16082e; --violet:#5b2fb0; --lilac:#b794f6; --soft:#f4ecff; --rose:#ff8fcf;
  --serif:'Forum',Georgia,'Times New Roman',serif;
  --sans:'Raleway',-apple-system,'Helvetica Neue',Arial,sans-serif;
  --w:min(46vw,250px);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{font-synthesis:none;font-family:var(--sans);font-weight:300;color:var(--soft);background:var(--ink);overflow-x:hidden;-webkit-text-size-adjust:100%}

/* ---------- фон ---------- */
.bg{position:fixed;inset:0;z-index:0;overflow:hidden;
  background:radial-gradient(120% 90% at 50% 0%,#3a1a74 0,#1d0c40 55%,#0f0522 100%)}
.bg i{position:absolute;border-radius:50%;filter:blur(70px);opacity:.55;will-change:transform;animation:drift 18s ease-in-out infinite alternate}
.bg i:nth-child(1){width:70vmax;height:70vmax;left:-25vmax;top:-20vmax;background:#7b3fe4}
.bg i:nth-child(2){width:60vmax;height:60vmax;right:-22vmax;top:25%;background:#c04fd0;animation-delay:-6s;opacity:.4}
.bg i:nth-child(3){width:65vmax;height:65vmax;left:-15vmax;bottom:-30vmax;background:#4a2bc2;animation-delay:-11s}
@keyframes drift{to{transform:translate(8vmax,6vmax) scale(1.15)}}
.bg::after{content:"";position:absolute;inset:0;
  background-image:radial-gradient(1.5px 1.5px at 20% 30%,#fff9 50%,transparent 51%),
  radial-gradient(1px 1px at 70% 20%,#fff8 50%,transparent 51%),
  radial-gradient(1.5px 1.5px at 40% 75%,#fff9 50%,transparent 51%),
  radial-gradient(1px 1px at 85% 65%,#fff8 50%,transparent 51%),
  radial-gradient(1px 1px at 10% 85%,#fff7 50%,transparent 51%),
  radial-gradient(1px 1px at 55% 45%,#fff6 50%,transparent 51%);
  background-size:340px 340px}

#words{position:fixed;inset:0;overflow:hidden;pointer-events:none;z-index:1}
#words span{position:absolute;bottom:-40px;font-family:var(--serif);color:#fff;opacity:.4;
  letter-spacing:.06em;animation:rise linear infinite;text-shadow:0 0 10px rgba(255,160,230,.7)}
@keyframes rise{from{transform:translateY(0)}to{transform:translateY(-115vh)}}

main{position:relative;z-index:2;min-height:100dvh;display:flex;flex-direction:column;align-items:center;
  justify-content:space-evenly;text-align:center;
  padding:calc(env(safe-area-inset-top,0px) + 22px) 16px calc(env(safe-area-inset-bottom,0px) + 22px)}
h1{font-family:var(--serif);font-weight:500;font-size:clamp(2.2rem,10vw,3.4rem);
  text-shadow:0 0 28px rgba(255,150,220,.55)}

.heart{display:block}
.beat{animation:beat 2.6s ease-in-out infinite}
@keyframes beat{0%,60%,100%{transform:scale(1)}15%{transform:scale(1.08)}30%{transform:scale(.98)}}

/* анимация открытия */
.halo{position:absolute;left:50%;top:50%;width:var(--w);height:var(--w);margin:calc(var(--w)/-2) 0 0 calc(var(--w)/-2);border-radius:50%;
  background:radial-gradient(circle,rgba(255,170,230,.75),transparent 65%);opacity:0;pointer-events:none;transform:scale(.4)}
.card.open .halo{animation:halo 1.6s ease-out .2s}
@keyframes halo{0%{opacity:0;transform:scale(.4)}35%{opacity:1}100%{opacity:0;transform:scale(3.2)}}
@keyframes reveal{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes pop{0%{opacity:0;transform:scale(.2)}60%{opacity:1;transform:scale(1.25)}100%{opacity:1;transform:scale(1)}}
.draw{stroke-dasharray:120;stroke-dashoffset:0;animation:draw 2s ease-out}
@keyframes draw{from{stroke-dashoffset:120}to{stroke-dashoffset:0}}

/* ---------- открытка ---------- */
.stage{perspective:1400px;width:100%;display:flex;justify-content:center}
.card{position:relative;width:var(--w);height:calc(var(--w)*1.45);cursor:pointer;
  transition:transform 1s cubic-bezier(.4,.1,.2,1);animation:bob 3.4s ease-in-out infinite}
.card.open{transform:translateX(calc(var(--w)/2));animation:none}
.card.open .inside{animation:lift 1.2s ease-out}
@keyframes lift{0%,100%{box-shadow:0 20px 44px rgba(10,0,30,.6)}40%{box-shadow:0 0 70px 14px rgba(255,150,225,.65)}}
@keyframes bob{50%{transform:translateY(-8px)}}
.inside{position:absolute;inset:0;border-radius:6px 16px 16px 6px;
  background:linear-gradient(150deg,#fff,#f6eaff 60%,#ead2ff);color:#4a1d86;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:14px;
  box-shadow:0 20px 44px rgba(10,0,30,.6)}
.inside .to{font-family:var(--serif);font-weight:600;font-size:clamp(1.2rem,5.6vw,1.6rem);line-height:1.2}
.inside .msg{font-family:var(--serif);font-weight:500;font-size:clamp(1rem,4.6vw,1.25rem);line-height:1.4;color:#6a28c4}
.cover{position:absolute;inset:0;transform-origin:left center;transform:perspective(1200px) rotateY(0deg);-webkit-transform-style:preserve-3d;transform-style:preserve-3d;transition:transform 1s cubic-bezier(.4,.1,.2,1)}
.card.open .cover{transform:perspective(1200px) rotateY(-172deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:6px 16px 16px 6px;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px}
.front{background:linear-gradient(145deg,#c58cff,#7a35d8 55%,#4b1b94);border:1px solid rgba(255,255,255,.4);
  box-shadow:0 20px 44px rgba(10,0,30,.6)}
.front small{font-family:var(--serif);font-size:1.05rem;color:#fff;opacity:.9}
.back{transform:rotateY(180deg);background:linear-gradient(200deg,#f1e1ff,#d9b8ff)}

/* ---------- таймер ---------- */
.timer{padding:16px 14px 14px;border-radius:22px;width:min(92vw,360px);
  background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.25);
  -webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px)}
.timer .lbl{font-family:var(--serif);font-size:1.2rem;margin-bottom:10px}
.units{display:flex;justify-content:center}
.units div{flex:1;padding:0 4px}
.units div+div{border-left:1px solid rgba(255,255,255,.25)}
.units b{display:block;font-family:var(--serif);font-weight:500;font-size:clamp(2.2rem,11vw,3rem);line-height:1.05}
.units span{font-size:.85rem;opacity:.8;letter-spacing:.04em}

/* ---------- кнопка ---------- */
.btn{font-family:var(--sans);font-weight:500;font-size:1rem;letter-spacing:.12em;color:#fff;cursor:pointer;
  padding:14px 38px;border-radius:999px;border:1px solid rgba(255,255,255,.55);
  background:rgba(255,255,255,.12);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px)}
.btn:active{transform:scale(.96)}

/* ---------- галерея ---------- */
#gallery{position:fixed;inset:0;z-index:10;display:none;background:var(--ink)}
#gallery.show{display:block}
#bgvid{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;filter:blur(2px) saturate(1.1)}
.veil{position:absolute;inset:0;background:linear-gradient(180deg,rgba(26,11,54,.78),rgba(70,30,130,.62) 50%,rgba(20,8,44,.86))}
.scroll{position:absolute;inset:0;overflow-y:auto;-webkit-overflow-scrolling:touch;
  padding:calc(env(safe-area-inset-top,0px) + 64px) 14px calc(env(safe-area-inset-bottom,0px) + 40px)}
.close{position:absolute;z-index:3;right:14px;top:calc(env(safe-area-inset-top,0px) + 12px);width:44px;height:44px;border-radius:50%;
  border:1px solid rgba(255,255,255,.4);background:rgba(255,255,255,.15);color:#fff;font-size:1.2rem;cursor:pointer;
  -webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px)}
.sec{max-width:560px;margin:0 auto 36px;text-align:center}
.sec h2{font-family:var(--serif);font-weight:500;font-size:1.8rem;margin-bottom:16px}
.grid{display:flex;flex-wrap:wrap;justify-content:center;gap:12px}
.grid>*{width:calc(50% - 6px)}
.shot{aspect-ratio:9/19;border-radius:20px;border:4px solid #1b0b36;overflow:hidden;background:#1b0b36;box-shadow:0 10px 28px rgba(10,0,30,.6)}
.pic{aspect-ratio:3/4;padding:6px 6px 0;border-radius:6px;background:#fff;box-shadow:0 10px 28px rgba(10,0,30,.6)}
.pic img,.shot img{width:100%;height:100%;object-fit:cover;display:block;cursor:pointer}
.pic img{border-radius:3px}
#lb{position:fixed;inset:0;z-index:20;display:none;align-items:center;justify-content:center;background:rgba(15,5,34,.93);padding:16px}
#lb.show{display:flex}
#lb img{max-width:100%;max-height:100%;border-radius:12px}
@media (prefers-reduced-motion:reduce){.card,.bg i{animation:none}#words{display:none}}

/* страницы открытки */
.card{touch-action:pan-y;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.inside{padding:20px 16px 26px}
.page{width:100%;text-align:center;white-space:pre-line;font-family:var(--serif);color:#5a22b0;
  font-size:clamp(1.05rem,4.9vw,1.3rem);line-height:1.45}
.page.big{font-size:clamp(1.4rem,6.6vw,1.8rem);color:#4a1d86}
.page .h{opacity:0}
.page .cur{display:inline-block;width:1px;height:1.05em;margin-left:2px;vertical-align:-.15em;background:#7b2fd0;animation:blink 1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
.page.in-next{animation:inNext .45s ease-out}
.page.in-prev{animation:inPrev .45s ease-out}
@keyframes inNext{from{opacity:0;transform:translateX(36px)}to{opacity:1;transform:none}}
@keyframes inPrev{from{opacity:0;transform:translateX(-36px)}to{opacity:1;transform:none}}
.page .pop{animation:pop .8s both,beat 2.6s ease-in-out .9s infinite}
.card.open .inside>.pgno{animation:reveal .9s ease-out 1.3s backwards}
.pgno{position:absolute;bottom:9px;left:0;right:0;text-align:center;font-family:var(--sans);font-size:.7rem;letter-spacing:.12em;color:#8a5fc9}
.btns{display:flex;gap:10px;justify-content:center;width:100%}
.btns .btn{padding:14px 20px;font-size:.9rem;letter-spacing:.08em}

/* причины */
#why{position:fixed;inset:0;z-index:10;display:none;align-items:center;justify-content:center;
  background:radial-gradient(120% 90% at 50% 0%,#4a2290 0,#1d0c40 60%,#0f0522 100%);padding:20px}
#why.show{display:flex}
.whybox{width:min(92vw,420px);text-align:center;display:flex;flex-direction:column;align-items:center;gap:22px}
.whybox h2{font-family:var(--serif);font-weight:400;font-size:1.7rem}
.reason{min-height:140px;width:100%;display:flex;align-items:center;justify-content:center;padding:22px 18px;border-radius:22px;
  background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.25);
  -webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);
  font-family:var(--serif);font-size:clamp(1.4rem,7vw,1.9rem);line-height:1.3}
.reason.swap{animation:reveal .6s ease-out}
.cnt{font-size:.85rem;opacity:.7;letter-spacing:.12em;margin-top:-10px}
</style>
</head>
<body>
<div class="bg"><i></i><i></i><i></i></div>
<div id="words"></div>

<main>
  <h1>Открой открытку</h1>

  <div class="stage">
    <div class="card" id="card" role="button" tabindex="0" aria-label="Открыть открытку">
      <div class="halo"></div>
      <div class="inside">
        <div class="page" id="page"></div>
        <div class="pgno" id="pgno"></div>
      </div>
      <div class="cover">
        <div class="face front">
          <svg class="heart beat" width="92" height="86" viewBox="0 0 32 30"><path class="draw" d="M16 27C6 19.5 2 14.5 2 9.5 2 5.6 5 3 8.5 3c3.2 0 6.1 1.8 7.5 4.6C17.4 4.8 20.3 3 23.5 3 27 3 30 5.6 30 9.5 30 14.5 26 19.5 16 27z" fill="none" stroke="#fff" stroke-width="1.1" stroke-linejoin="round"/></svg>
          <small>нажми</small>
        </div>
        <div class="face back"><svg class="heart" width="34" height="32" viewBox="0 0 32 30"><path d="M16 27C6 19.5 2 14.5 2 9.5 2 5.6 5 3 8.5 3c3.2 0 6.1 1.8 7.5 4.6C17.4 4.8 20.3 3 23.5 3 27 3 30 5.6 30 9.5 30 14.5 26 19.5 16 27z" fill="#a85df0"/></svg></div>
      </div>
    </div>
  </div>

  <div class="timer">
    <div class="lbl">Мы вместе</div>
    <div class="units">
      <div><b id="y">0</b><span id="yl">год</span></div>
      <div><b id="mo">0</b><span id="ml">месяцев</span></div>
      <div><b id="d">0</b><span id="dl">дней</span></div>
    </div>
  </div>

  <div class="btns">
    <button class="btn" id="openGal">Наша история</button>
    <button class="btn" id="openWhy">Причины</button>
  </div>
</main>

<section id="gallery" aria-label="Наша история">
  <video id="bgvid" muted loop playsinline webkit-playsinline preload="auto">
    <source src="img/video1.mp4" type="video/mp4">
  </video>
  <div class="veil"></div>
  <button class="close" id="closeGal" aria-label="Закрыть">✕</button>
  <div class="scroll">
    <div class="sec"><h2>Воспоминания</h2><div class="grid" id="gShots"></div></div>
    <div class="sec"><h2>Жаным</h2><div class="grid" id="gPics"></div></div>
  </div>
</section>

<section id="why" aria-label="Причины">
  <button class="close" id="closeWhy" aria-label="Закрыть">✕</button>
  <div class="whybox">
    <h2>Почему я тебя люблю</h2>
    <div class="reason" id="reason"></div>
    <div class="cnt" id="cnt"></div>
    <button class="btn" id="nextWhy">Ещё причина</button>
  </div>
</section>

<div id="lb"><img alt=""></div>

<script>
/* ====== НАСТРОЙКИ ====== */
const START = new Date(2025, 2, 25);   // 25 марта 2025 (месяцы с 0: 2 = март)
/* ======================= */

/* маленькие надписи на фоне */
const words = ['Анеля','love','you','pretty','nelya','beautiful'];
const wr = document.getElementById('words');
for (let i = 0; i < 22; i++) {
  const s = document.createElement('span');
  s.textContent = words[i % words.length];
  s.style.left = (4 + Math.random() * 88) + '%';
  s.style.fontSize = (11 + Math.random() * 6) + 'px';
  s.style.animationDuration = (16 + Math.random() * 16) + 's';
  s.style.animationDelay = (-Math.random() * 30) + 's';
  wr.appendChild(s);
}

/* открытка */
const card = document.getElementById('card');
const PAGES = [
  null,
  'For my\npretty girl',
  null,
  'Привет, любимая',
  null,
  'я тебя очень сильно люблю',
  null,
  'чтобы тебе не было скучно, расскажу историю',
  'летом, когда я гулял с 8н, с нами также была Акнур, ее подруги и Асель Р.',
  'Мы играли в догонялки и когда Даулет убегал, он',
  'он со всей силы врезался в турник, не увидев его',
  'потому что было очень темно',
  'он упал на землю с кровью со рта',
  'мы в панике стояли все вокруг него',
  'Асель Р. плакала, уговаривала Даулета пойти домой',
  'Она успокоилась по пути и уже было все хорошо, но',
  'но я продолжал плакать по пути до дома Даулета',
  'потому что мне было его очень жалко',
  'Я пытался плакать незаметно и пытался успокоиться,',
  'чтобы не привлекать лишнее внимание',
  'но у меня не получилось и Асель все таки заметила',
  'и спросила все ли хорошо',
  'через несколько дней мы снова встретили',
  'Даулета и поиграли баскетбол, все круто и все хорошо!!',
  'люблю тебя жаным',
  'очень скучаю по тебе'
];
const page = document.getElementById('page'), pgno = document.getElementById('pgno');
let idx = 0, typeTimer = null;

function show(i, dir) {
  clearTimeout(typeTimer);
  idx = i;
  const t = PAGES[i];
  page.className = 'page' + (i === 1 ? ' big' : '');
  void page.offsetWidth;
  page.classList.add(dir < 0 ? 'in-prev' : 'in-next');
  pgno.textContent = i === 0 ? 'смахни  →' : (i + 1) + ' / ' + PAGES.length;
  if (t === null) {
    page.innerHTML = '<svg class="heart pop" width="64" height="60" viewBox="0 0 32 30"><path d="M16 27C6 19.5 2 14.5 2 9.5 2 5.6 5 3 8.5 3c3.2 0 6.1 1.8 7.5 4.6C17.4 4.8 20.3 3 23.5 3 27 3 30 5.6 30 9.5 30 14.5 26 19.5 16 27z" fill="#c24fe0"/></svg>';
    return;
  }
  page.innerHTML = '<span class="v"></span><span class="cur"></span><span class="h"></span>';
  const v = page.querySelector('.v'), h = page.querySelector('.h');
  let k = 0;
  h.textContent = t;
  (function step() {
    k++;
    v.textContent = t.slice(0, k);
    h.textContent = t.slice(k);
    if (k < t.length) typeTimer = setTimeout(step, ',.!'.includes(t[k - 1]) ? 260 : 45);
  })();
}
function go(d) {
  const n = idx + d;
  if (n < 0) return;
  if (n >= PAGES.length) { closeCard(); return; }
  show(n, d);
}
function openCard() {
  card.classList.add('open'); burst();
  clearTimeout(typeTimer);
  typeTimer = setTimeout(() => show(0, 1), 900);
}
function closeCard() {
  card.classList.remove('open');
  clearTimeout(typeTimer); idx = 0; page.innerHTML = ''; pgno.textContent = '';
}
let sx = 0;
card.addEventListener('pointerdown', e => { sx = e.clientX; });
card.addEventListener('pointerup', e => {
  if (!card.classList.contains('open')) { openCard(); return; }
  const dx = e.clientX - sx;
  if (Math.abs(dx) > 40) { go(dx < 0 ? 1 : -1); return; }
  const r = card.getBoundingClientRect();
  go(e.clientX < r.left + r.width / 2 ? -1 : 1);
});
card.addEventListener('keydown', e => {
  if (!card.classList.contains('open')) { if (e.key === 'Enter' || e.key === ' ') openCard(); return; }
  if (e.key === 'ArrowRight') go(1);
  if (e.key === 'ArrowLeft') go(-1);
});
function burst() {
  const r = card.getBoundingClientRect();
  for (let i = 0; i < 30; i++) {
    const h = document.createElement('div');
    h.textContent = i % 3 ? '♥' : '✦';
    h.style.cssText = `position:fixed;z-index:5;pointer-events:none;font-size:${16 + Math.random() * 12}px;color:#ffb3e1;left:${r.left + r.width / 2}px;top:${r.top + r.height / 2}px;transition:transform 1.6s ease-out ${(i%3)*0.12}s,opacity 1.6s ${(i%3)*0.12}s`;
    document.body.appendChild(h);
    requestAnimationFrame(() => {
      h.style.transform = `translate(${(Math.random() - .5) * 320}px,${-80 - Math.random() * 260}px) rotate(${Math.random() * 60 - 30}deg)`;
      h.style.opacity = 0;
    });
    setTimeout(() => h.remove(), 1700);
  }
}

/* таймер: годы, месяцы, дни */
function plural(n, a, b, c) {
  const m = n % 100, k = n % 10;
  if (m > 10 && m < 20) return c;
  if (k === 1) return a;
  if (k > 1 && k < 5) return b;
  return c;
}
function tick() {
  const now = new Date();
  let y = now.getFullYear() - START.getFullYear();
  let m = now.getMonth() - START.getMonth();
  let d = now.getDate() - START.getDate();
  if (d < 0) { m--; d += new Date(now.getFullYear(), now.getMonth(), 0).getDate(); }
  if (m < 0) { y--; m += 12; }
  document.getElementById('y').textContent = y;
  document.getElementById('mo').textContent = m;
  document.getElementById('d').textContent = d;
  document.getElementById('yl').textContent = plural(y, 'год', 'года', 'лет');
  document.getElementById('ml').textContent = plural(m, 'месяц', 'месяца', 'месяцев');
  document.getElementById('dl').textContent = plural(d, 'день', 'дня', 'дней');
}
tick(); setInterval(tick, 60000);

/* галерея: файлы в папке img/ (1.jpg … 10.jpg, video1.mp4) */
const exts = ['jpg', 'png', 'jpeg', 'webp'];
function mk(n, cls, host) {
  const w = document.createElement('div'); w.className = cls;
  const img = document.createElement('img'); img.alt = 'Фото ' + n; img.loading = 'lazy';
  let i = 0;
  img.onerror = () => { if (++i < exts.length) img.src = `img/${n}.${exts[i]}`; else w.style.display = 'none'; };
  img.src = `img/${n}.${exts[0]}`;
  img.onclick = () => { lb.querySelector('img').src = img.src; lb.classList.add('show'); };
  w.appendChild(img); host.appendChild(w);
}
for (let n = 1; n <= 5; n++) mk(n, 'shot', gShots);
for (let n = 6; n <= 10; n++) mk(n, 'pic', gPics);

/* причины */
const REASONS = ['ты красавица','ты крутая','ты умница','ты ревнивая','ты часто пишешь первой','ты мне поднимаешь настроение',
  'ты тактильная','ты всегда возвращаешься ко мне','ты не забываешь про меня','ты понимаешь мои чувства, без моих слов',
  'у тебя крутой вайб','у тебя красивые глазки','ты хорошо учишься','ты стабильная','ты меня всегда поддерживаешь',
  'ты мне проявляешь внимание','я не безразличен тебе','ты знакома с зерешкой хахаха','ты меня крепко обнимаешь!!'];
const LAST = 'я тебя люблю за просто так!!';
let order = [], ri = 0;
function shuffleReasons() {
  order = REASONS.map(r => [Math.random(), r]).sort((a, b) => a[0] - b[0]).map(x => x[1]);
  order.push(LAST); ri = 0;
}
function nextReason() {
  if (ri >= order.length) shuffleReasons();
  reason.textContent = order[ri]; ri++;
  cnt.textContent = ri + ' из ' + order.length;
  reason.classList.remove('swap'); void reason.offsetWidth; reason.classList.add('swap');
  nextWhy.textContent = ri >= order.length ? 'Сначала' : 'Ещё причина';
}
openWhy.onclick = () => { shuffleReasons(); why.classList.add('show'); nextReason(); };
closeWhy.onclick = () => why.classList.remove('show');
nextWhy.onclick = nextReason;
